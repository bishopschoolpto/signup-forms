# Builds site/index.html from src/ (scripts/build-site.js, with apiUrl from
# site.config.json) and publishes it with GitHub Pages, served at the custom
# domain set in Settings → Pages (signups.bishopschoolpto.com).
name: Deploy sign-up site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The unit tests and the site build use only Node's built-ins: no npm install needed.
      - name: Unit tests
        run: node --test test/unit/
      - name: Build site/index.html
        run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
